<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}{% endblock %} - {{ system.name }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

  <!-- TOP MENU (shown on every page) -->
  <div class="topbar">
    <b>{{ system.name }}</b><br>
    {% for item in nav %}
      {% if item.endpoint == 'manage' %}
        <a href="/manage/{{ item.key }}">{{ item.label }}</a>
      {% else %}
        <a href="{{ url_for(item.endpoint) }}">{{ item.label }}</a>
      {% endif %}
    {% endfor %}
  </div>

  <div class="page">
    <!-- Success / error messages -->
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="{{ category }}">{{ message }}</p>
    {% endfor %}

    <!-- Each page puts its content here -->
    {% block content %}{% endblock %}
  </div>

</body>
</html>
