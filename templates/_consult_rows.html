<!-- Consultation results table (used by inquiries 3, 4, and 5) -->
<table>
  <tr><th>Consult No.</th><th>Patient ID</th><th>Doctor ID</th><th>Date/Time</th><th>Diagnosis</th><th>Prescription</th></tr>
  {% for r in result.rows %}
  <tr>
    <td>{{ r['consultID'] }}</td><td>{{ r['patID'] }}</td><td>{{ r['docID'] }}</td>
    <td>{{ r['consultDate'] }}</td><td>{{ r['diagnosis'] }}</td><td>{{ r['prescription'] }}</td>
  </tr>
  {% endfor %}
</table>
