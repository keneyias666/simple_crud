<!-- A plain table. Needs: columns (list of {name, label}) and rows. -->
{% if rows %}
  <table>
    <tr>
      {% for col in columns %}
        <th>{{ col.label }}</th>
      {% endfor %}
    </tr>
    {% for row in rows %}
      <tr>
        {% for col in columns %}
          <td>{{ row[col.name] }}</td>
        {% endfor %}
      </tr>
    {% endfor %}
  </table>
{% else %}
  <p>No records.</p>
{% endif %}
