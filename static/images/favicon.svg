<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Box/Product Icon -->
  <rect x="6" y="10" width="20" height="16" rx="2" fill="url(#faviconGradient)"/>
  <rect x="8" y="12" width="16" height="12" rx="1.5" fill="none" stroke="white" stroke-width="1" opacity="0.9"/>
  <!-- Plus sign -->
  <line x1="16" y1="14" x2="16" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="17" x2="19" y2="17" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>

