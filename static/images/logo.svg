<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38a169;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Box/Product Icon -->
  <rect x="10" y="15" width="30" height="25" rx="3" fill="url(#logoGradient)" opacity="0.9"/>
  <rect x="12" y="17" width="26" height="21" rx="2" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <!-- Plus sign for Add/Create -->
  <line x1="25" y1="20" x2="25" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="20" y1="25" x2="30" y2="25" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Decorative elements -->
  <circle cx="15" cy="12" r="2" fill="url(#logoGradient)" opacity="0.6"/>
  <circle cx="35" cy="12" r="2" fill="url(#logoGradient)" opacity="0.6"/>
</svg>

